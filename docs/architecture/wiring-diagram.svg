<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Smart Plant Monitoring System hardware wiring" xmlns:c2pa="http://c2pa.org/manifest">
<title>Smart Plant Monitoring System - Hardware Wiring</title>
<defs>
  <style>
    .bg{fill:#f8fafc}
    .panel{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
    .title{font-size:28px;font-weight:700;fill:#0f172a}
    .sub{font-size:15px;fill:#475569}
    .h{font-size:15px;font-weight:700;letter-spacing:.8px;fill:#0f172a}
    .t{font-size:14px;fill:#334155}
    .s{font-size:13px;fill:#64748b}
    .term{font-size:13px;font-weight:700;fill:#334155}
    .pin{font-size:13px;font-weight:700;fill:#ffffff}
    .lbl{font-size:12px;font-style:italic;fill:#64748b}
    .w{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .red{stroke:#dc2626}.blk{stroke:#111827}.yel{stroke:#f59e0b}.blu{stroke:#2563eb}
  </style>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>

<rect class="bg" width="1400" height="900"/>

<!-- Header -->
<text x="60" y="56" class="title">SMART PLANT MONITORING SYSTEM — HARDWARE WIRING</text>
<text x="60" y="84" class="sub">ESP32-WROOM-32 DevKit V1 · DHT11 · Potentiometer soil-moisture simulator</text>
<line x1="60" y1="104" x2="1340" y2="104" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- ESP32 board -->
<g filter="url(#sh)">
  <rect x="540" y="170" width="320" height="510" rx="20" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
</g>
<rect x="670" y="666" width="60" height="26" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
<text x="700" y="684" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">USB</text>
<rect x="600" y="190" width="200" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
<text x="700" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">ESP32-WROOM-32</text>
<text x="700" y="288" text-anchor="middle" font-size="13" fill="#94a3b8">DevKit V1</text>
<text x="700" y="632" text-anchor="middle" font-size="13" fill="#94a3b8">GPIO34 = ADC1_CH6 · input-only</text>

<!-- Wires (drawn before pins so pin dots sit on top) -->
<!-- DHT11 -->
<path class="w red" d="M360 270 H540"/>
<path class="w yel" d="M360 340 H540"/>
<path class="w blk" d="M360 410 H540"/>
<!-- 3V3 rail and GND rail to potentiometer -->
<path class="w red" d="M450 270 V150 H980 V270 H1040"/>
<path class="w blk" d="M450 410 V730 H980 V410 H1040"/>
<!-- ADC signal -->
<path class="w blu" d="M860 340 H1040"/>

<!-- Junction dots -->
<circle cx="450" cy="270" r="6" fill="#dc2626"/>
<circle cx="450" cy="410" r="6" fill="#111827"/>

<!-- Wire labels -->
<text x="405" y="262" text-anchor="middle" class="lbl">3.3 V</text>
<text x="405" y="332" text-anchor="middle" class="lbl">DATA</text>
<text x="405" y="402" text-anchor="middle" class="lbl">GND</text>
<text x="715" y="142" text-anchor="middle" class="lbl">3.3 V RAIL</text>
<text x="715" y="722" text-anchor="middle" class="lbl">GND RAIL</text>
<text x="950" y="332" text-anchor="middle" class="lbl">ADC signal</text>

<!-- ESP32 pins -->
<g>
  <circle cx="540" cy="270" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <rect x="556" y="257" width="74" height="26" rx="6" fill="#dc2626"/>
  <text x="593" y="275" text-anchor="middle" class="pin">3V3</text>

  <circle cx="540" cy="340" r="7" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  <rect x="556" y="327" width="74" height="26" rx="6" fill="#f59e0b"/>
  <text x="593" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">GPIO13</text>

  <circle cx="540" cy="410" r="7" fill="#ffffff" stroke="#9ca3af" stroke-width="3"/>
  <rect x="556" y="397" width="74" height="26" rx="6" fill="#374151" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="593" y="415" text-anchor="middle" class="pin">GND</text>

  <circle cx="860" cy="340" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <rect x="770" y="327" width="74" height="26" rx="6" fill="#2563eb"/>
  <text x="807" y="345" text-anchor="middle" class="pin">GPIO34</text>
</g>

<!-- DHT11 module -->
<g filter="url(#sh)">
  <rect x="60" y="190" width="300" height="330" rx="16" class="panel"/>
</g>
<text x="84" y="226" class="h">DHT11 MODULE</text>
<text x="84" y="246" class="s">Temperature + relative humidity</text>
<rect x="84" y="270" width="110" height="150" rx="8" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
<g stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
  <line x1="102" y1="298" x2="176" y2="298"/><line x1="102" y1="322" x2="176" y2="322"/>
  <line x1="102" y1="346" x2="176" y2="346"/><line x1="102" y1="370" x2="176" y2="370"/>
  <line x1="102" y1="394" x2="176" y2="394"/>
</g>
<text x="342" y="275" text-anchor="end" class="term">VCC</text>
<text x="342" y="345" text-anchor="end" class="term">DATA / S</text>
<text x="342" y="415" text-anchor="end" class="term">GND</text>
<circle cx="360" cy="270" r="6" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<circle cx="360" cy="340" r="6" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
<circle cx="360" cy="410" r="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<text x="84" y="465" class="s">Verify the module's pin order before power-up;</text>
<text x="84" y="484" class="s">some modules include a DATA pull-up resistor.</text>

<!-- Potentiometer -->
<g filter="url(#sh)">
  <rect x="1040" y="190" width="300" height="330" rx="16" class="panel"/>
</g>
<text x="1064" y="226" class="h">POTENTIOMETER</text>
<text x="1064" y="246" class="s">Simulated soil-moisture input</text>
<text x="1062" y="275" class="term">3V3 (outer 1)</text>
<text x="1062" y="345" class="term">Wiper (center)</text>
<text x="1062" y="415" class="term">GND (outer 2)</text>
<circle cx="1040" cy="270" r="6" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
<circle cx="1040" cy="340" r="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
<circle cx="1040" cy="410" r="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
<circle cx="1272" cy="340" r="42" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<circle cx="1272" cy="340" r="12" fill="#d97706"/>
<line x1="1272" y1="340" x2="1298" y2="312" stroke="#92400e" stroke-width="6" stroke-linecap="round"/>
<text x="1064" y="465" class="s">Reversing the outer terminals reverses</text>
<text x="1064" y="484" class="s">the direction of the ADC response.</text>

<!-- Legend -->
<rect x="60" y="775" width="700" height="95" rx="12" class="panel"/>
<text x="84" y="802" class="h" font-size="12" letter-spacing="1.6">WIRING LEGEND</text>
<g class="w" stroke-width="4">
  <path class="red" d="M84 836 H124"/><path class="blk" d="M245 836 H285"/>
  <path class="yel" d="M375 836 H415"/><path class="blu" d="M540 836 H580"/>
</g>
<text x="134" y="841" class="t">3.3 V supply</text>
<text x="295" y="841" class="t">Ground</text>
<text x="425" y="841" class="t">DHT11 data</text>
<text x="590" y="841" class="t">ADC input</text>

<!-- Notes -->
<rect x="790" y="775" width="550" height="95" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="814" y="802" class="h" font-size="12" letter-spacing="1.6">IMPORTANT</text>
<text x="814" y="831" class="t">All grounds must be common.</text>
<text x="814" y="853" class="t">Keep ESP32 inputs within 0–3.3 V.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
